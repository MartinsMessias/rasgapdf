[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rasgapdf"
version = "0.2.0"
authors = [
  { name="Messias Martins" },
]
description = "Ultra-fast 2D spatial PDF parser powered by pure Rust — extract exact [x0, y0, x1, y1] bounding boxes, text blocks, tables, images & vector paths in milliseconds for RAG & LLMs"
readme = "README.md"
requires-python = ">=3.8"
keywords = [
    "pdf",
    "pdf-parser",
    "spatial-pdf",
    "bounding-box",
    "layout-analysis",
    "table-extraction",
    "pdf-to-json",
    "rag",
    "llm",
    "document-parsing",
    "document-ai",
    "coordinates",
    "rust",
    "mupdf",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Rust",
    "License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)",
    "Operating System :: POSIX :: Linux",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: MacOS",
    "Topic :: Text Processing :: General",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = []

[project.urls]
"Homepage" = "https://martinsmessias.github.io/rasgapdf/"
"Repository" = "https://github.com/MartinsMessias/rasgapdf"
"Documentation" = "https://github.com/MartinsMessias/rasgapdf/blob/main/docs/SCHEMA.md"
"Live Demo" = "https://huggingface.co/spaces/martinsmessias/rasgapdf"
"Hugging Face" = "https://huggingface.co/martinsmessias/rasgapdf"
"Bug Tracker" = "https://github.com/MartinsMessias/rasgapdf/issues"
"LLM Context" = "https://martinsmessias.github.io/rasgapdf/llms.txt"

[tool.setuptools.packages.find]
where = ["."]
include = ["rasgapdf*"]

[tool.setuptools.package-data]
rasgapdf = ["*.so", "*.dylib", "*.dll"]
