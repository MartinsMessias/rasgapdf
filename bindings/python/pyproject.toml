[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rasgapdf"
version = "0.1.2"
authors = [
  { name="Messias Martins" },
]
description = "Ultra-fast 2D spatial PDF parser powered by Rust"
readme = "README.md"
requires-python = ">=3.8"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Rust",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Topic :: Text Processing :: General",
]
dependencies = []

[project.urls]
"Homepage" = "https://huggingface.co/martinsmessias/rasgapdf"
"Repository" = "https://huggingface.co/martinsmessias/rasgapdf"
"Discussions" = "https://huggingface.co/martinsmessias/rasgapdf/discussions"

[tool.setuptools.packages.find]
where = ["."]
include = ["rasgapdf*"]

[tool.setuptools.package-data]
rasgapdf = ["*.so", "*.dylib", "*.dll"]
