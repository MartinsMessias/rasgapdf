[package]
name = "rasgapdf"
version = "0.2.1"
edition = "2021"
authors = ["Messias Martins"]
description = "Blazing-fast spatial 2D PDF parser in pure Rust with multi-language bindings (Python, Node.js, Go, C#) for RAG, LLMs, bounding boxes, and table extraction"
license = "AGPL-3.0-or-later"
readme = "README.md"
homepage = "https://martinsmessias.github.io/rasgapdf/"
documentation = "https://docs.rs/rasgapdf"
repository = "https://github.com/MartinsMessias/rasgapdf"
keywords = ["pdf", "spatial", "parser", "layout-analysis", "bounding-box"]
categories = ["text-processing", "parsing", "command-line-utilities"]
exclude = [
    "bindings/*",
    "demo_gradio/*",
    "space_hf/*",
    "upload_to_hf.py",
    "publish_all.sh",
]

[lib]
name = "rasgapdf"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "rasgapdf"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
mupdf = { version = "0.8.0", features = ["serde"] }
rayon = "1.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
